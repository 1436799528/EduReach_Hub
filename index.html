<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E40AF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Per-route metadata (canonical, Open Graph, JSON-LD) is applied by
         src/lib/seoMeta.ts on navigation; these are the defaults for the first
         render and for crawlers that do not execute scripts. -->
    <meta name="robots" content="index,follow" />
    <meta property="og:site_name" content="EduReach Hub" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_NG" />
    <meta name="twitter:card" content="summary" />
    <!-- Inter loads from the head so it starts in parallel with the app bundle.
         It used to be a CSS @import inside src/styles/theme.css, which could not
         start until the 42 KB bundle CSS had arrived and parsed. The variable range
         serves one file per subset instead of six static weights, and display=swap
         keeps text visible while it loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo/edureach-hub-app-icon.svg" />
    <style>
      .pwa-boot-splash {
        display: none;
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      @media (display-mode: standalone), (display-mode: window-controls-overlay), (display-mode: minimal-ui) {
        .pwa-boot-splash {
          display: flex;
        }
      }
      .pwa-boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 320px;
        width: 100%;
        gap: 12px;
      }
      .pwa-boot-logo {
        width: 88px;
        height: 88px;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
        border: 1px solid #e2e8f0;
        display: grid;
        place-items: center;
        animation: pwa-pulse 2s infinite ease-in-out;
      }
      .pwa-boot-logo img {
        width: 68px;
        height: 54px;
        object-fit: contain;
      }
      .pwa-boot-brand {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .pwa-boot-title {
        font-size: 20px;
        font-weight: 750;
        color: #0f172a;
        letter-spacing: -0.02em;
      }
      .pwa-boot-tagline {
        font-size: 12px;
        font-weight: 500;
        color: #475569;
      }
      .pwa-boot-loader {
        width: 130px;
        height: 4px;
        background: #e2e8f0;
        border-radius: 9999px;
        overflow: hidden;
        margin-top: 10px;
        position: relative;
      }
      .pwa-boot-bar {
        width: 45%;
        height: 100%;
        background: #1e40af;
        border-radius: 9999px;
        animation: pwa-slide 1.4s infinite ease-in-out;
      }
      .pwa-boot-status {
        margin: 0;
        font-size: 11px;
        color: #64748b;
        font-weight: 500;
      }
      @keyframes pwa-slide {
        0% {
          transform: translateX(-100%);
        }
        50% {
          transform: translateX(110%);
        }
        100% {
          transform: translateX(240%);
        }
      }
      @keyframes pwa-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.04);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pwa-boot-logo,
        .pwa-boot-bar {
          animation: none !important;
        }
      }
    </style>
    <!-- The PWA boot splash styles live in the head: <style> is only permitted
         there in HTML, the parser reaches it before the body, and the splash is
         the one thing that must paint before the bundle arrives. -->
    <title>EduReach Hub | Student Services, CBT &amp; Education Updates</title>
    <meta
      name="description"
      content="EduReach Hub brings verified student services, CBT practice, education news, scholarships, admission tools, and a student dashboard together for Nigerian students."
    />
  </head>
  <body>
    <div id="root">
      <div id="pwa-boot-splash" class="pwa-boot-splash" role="status" aria-label="Loading EduReach Hub">
        <div class="pwa-boot-card">
          <div class="pwa-boot-logo">
            <img src="/logo/edureach-hub-mark.svg" alt="" width="80" height="64" />
          </div>
          <div class="pwa-boot-brand">
            <span class="pwa-boot-title">EduReach Hub</span>
            <span class="pwa-boot-tagline">Student Services &amp; CBT Portal</span>
          </div>
          <div class="pwa-boot-loader" aria-hidden="true">
            <div class="pwa-boot-bar"></div>
          </div>
          <p class="pwa-boot-status">Loading application&hellip;</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
