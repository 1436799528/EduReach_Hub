# EduReach production target (see docs/DEPLOYMENT_DECISION.md).
#
# SECRET SCANNING STAYS ENABLED ON THIS SITE.
# Never set SECRETS_SCAN_ENABLED=false, never safelist a detected value, and
# never exclude a directory to make a deploy pass. The scan only fires when a real
# configured value appears in repository content or build output, so the fix is
# always in the repository: replace the value with a placeholder, or rotate and
# remove it. A variable that is genuinely public but flagged secret is
# re-classified under a new name (docs/NETLIFY_PRODUCTION_SETUP.md section 3,
# EDUREACH_PUBLIC_SUPABASE_*). See SECURITY.md.
#
# The repository previously described this file and netlify/functions/api.ts
# without containing either: Netlify had no build command or publish directory,
# every deploy failed in ~25 seconds, and the live site stayed on an October
# deployment. This file is the source of truth for the Netlify build.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # A production NODE_ENV makes npm skip devDependencies, and Vite/Terser live
  # there. The build needs them even when the site runs in production mode.
  NPM_FLAGS = "--include=dev"
  # Netlify site variables are managed outside this repository. If the public
  # Supabase pair is absent, publish the unconfigured shell (the app has an
  # honest offline state and the server API still reads its own environment)
  # instead of leaving production on an old build. A privileged key still fails.
  EDUREACH_ALLOW_UNCONFIGURED_CLIENT = "1"

[functions]
  node_bundler = "esbuild"

# The API must never fall through to index.html. The function is the legacy
# handler export used by serverless-http; the app normalises both the original
# `/api/...` path and the `/.netlify/functions/api/...` rewrite target.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# robots.txt and sitemap.xml are generated by Express, not static files. Without
# these rules the SPA fallback would return index.html with a 200 to a crawler.
[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/api/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api/sitemap.xml"
  status = 200
  force = true

