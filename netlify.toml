# EduReach production target (see docs/DEPLOYMENT_DECISION.md).
#
# The repository previously described this file and netlify/functions/api.ts
# without containing either: Netlify had no build command or publish directory,
# every deploy failed in ~25 seconds, and the live site stayed on an October
# deployment. This file is the source of truth for the Netlify build.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# The API must never fall through to index.html. The function is the legacy
# handler export used by serverless-http; the app normalises both the original
# `/api/...` path and the `/.netlify/functions/api/...` rewrite target.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# robots.txt and sitemap.xml are generated by Express, not static files. Without
# these rules the SPA fallback would return index.html with a 200 to a crawler.
[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/api/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api/sitemap.xml"
  status = 200
  force = true

# Client-side routes fall back to the SPA shell. Assets are served from /assets
# with immutable caching by public/_headers.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
