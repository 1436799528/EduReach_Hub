name: Repair PR31 dependency lockfile
on:
  push:
    branches:
      - fix/prefer-modern-supabase-secret-key
permissions:
  contents: write
jobs:
  update-lockfile:
    if: "!contains(github.event.head_commit.message, 'chore: refresh patched dependency lockfile')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prefer-modern-supabase-secret-key
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve patched dependency versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "chore: refresh patched dependency lockfile"
          git push origin HEAD:fix/prefer-modern-supabase-secret-key
