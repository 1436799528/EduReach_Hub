name: EduReach production checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One gate per ref: a new push cancels the run it supersedes, so a PR never
# reports a verdict for a commit that has already been replaced.
concurrency:
  group: production-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    # `npm ci` + the full `npm run ci` chain (typecheck, unit tests, schema audit,
    # migration checklist, build, perf, analytics, Playwright on desktop and
    # mobile, perf profile, RLS/a11y audits) takes about 15 minutes on a cold
    # runner. The ceiling exists so a hung browser cannot hold a merge queue
    # forever.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Lint and format are also part of `npm run ci`; running them first gives a
      # named failure in seconds instead of a red job 15 minutes into the gate.
      - name: Lint and format check
        run: npm run lint && npm run format:check

      # Every command the gate used to run behind one `npm run ci` now has a
      # named step: a red job says which command failed instead of only
      # "Process completed with exit code 1".
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Schema audit
        run: npm run schema:audit && npm run migrations:checklist

      - name: Production build
        run: npm run build

      - name: Performance budget
        run: npm run perf:audit

      - name: Analytics audit
        run: npm run analytics:audit

      - name: End-to-end tests
        run: npm run test:e2e

      - name: End-to-end performance
        run: npm run e2e:perf

      - name: Database and accessibility audits
        run: npm run rls:audit && npm run a11y:audit && npm run audit:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Annotate Playwright failures
        if: failure()
        run: node scripts/e2e-failure-annotations.mjs
