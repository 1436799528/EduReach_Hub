<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="scratchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#scratchBg)"/>
  <!-- Card Rectangle -->
  <rect x="20" y="26" width="60" height="42" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
  <!-- Magnetic stripe -->
  <rect x="20" y="34" width="60" height="9" fill="#78350f"/>
  <!-- Scratch foil strip -->
  <rect x="26" y="50" width="40" height="10" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-dasharray="2 2"/>
  <text x="46" y="58" text-anchor="middle" fill="#475569" font-family="monospace" font-size="6.5" font-weight="900">•••• ••••</text>
  <!-- Security lock icon -->
  <circle cx="70" cy="55" r="3" fill="#d97706"/>
  <!-- Label -->
  <text x="50" y="86" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" letter-spacing="1">PIN / TOKEN</text>
</svg>
